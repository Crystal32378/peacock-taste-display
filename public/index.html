<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Taste Display — a peacock with opinions</title>
<meta name="description" content="A peacock, ten feathers. Where your taste meets theirs, the feathers shiver. Where it does not, the tail folds. No score, ever.">
<meta property="og:type" content="website">
<meta property="og:title" content="Taste Display — a peacock with opinions">
<meta property="og:description" content="Ten feathers, one taste each. Where yours meets theirs, the feathers shiver. Where it does not, the tail folds. No score, ever.">
<meta property="og:image" content="https://taste-display.onrender.com/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://taste-display.onrender.com/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Instrument+Sans:wght@400;500&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%230C1512%27 stroke=%27%23C9A66B%27/%3E%3Cellipse cx=%2716%27 cy=%2714%27 rx=%276%27 ry=%278%27 fill=%27%231B9AA6%27/%3E%3Cellipse cx=%2716%27 cy=%2715%27 rx=%272.4%27 ry=%273.6%27 fill=%27%230A0E2C%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="top"><span>Taste Display</span>
    <span class="right"><button type="button" id="snd" class="snd" aria-pressed="false">Sound: off</button><span class="mode lang" role="group" aria-label="Language"><button type="button" id="lEn" aria-pressed="true">EN</button><button type="button" id="lZh" aria-pressed="false">中</button></span><span class="mode" role="group" aria-label="Intent"><button type="button" id="mFriend" aria-pressed="true">Friend</button><button type="button" id="mLover" aria-pressed="false">Lover</button></span></span>
  </div>
  <p class="setup" id="setup"></p>
  <div class="stage">
    <div class="who">
      <div class="arch"><img id="portrait" alt="" width="720" height="900"></div>
      <h1 id="name">&nbsp;</h1>
      <p class="meta" id="meta"></p>
      <p class="blurb" id="blurb"></p>
      <p class="tasteLine" id="tasteLine"></p>
      <p class="fict" id="fict">Fictional characters · 18+ · nobody is contacted</p>
    </div>
    <div id="stageSvg"></div>
  </div>
  <div class="cap" aria-live="polite"><p class="en" id="capEn"></p><p class="zh" id="capZh"></p><p class="fav" id="capFav"></p><p class="hits" id="hits"></p></div>
  <div class="ctl">
    <button type="button" id="replay">Replay</button>
    <button type="button" id="bridge" hidden></button>
    <button type="button" id="next">Next</button>
    <button type="button" id="auto" aria-pressed="false">Auto-play: off</button>
  </div>
  <p class="castHint" id="castHint">Meet someone else</p>
  <div class="cast" id="castRow" aria-label="Choose a character"></div>
  <p class="you" id="you"></p>
  <details>
    <summary id="sumText">Under the hood: Qloo call log</summary>
    <p class="engine" id="engine"></p>
    <pre id="trace"></pre>
    <p class="note" id="note"></p>
  </details>
  <p class="foot">Taste is not a score. It is a display.</p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
